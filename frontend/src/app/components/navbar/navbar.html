<nav class="navbar">
  <!-- Background gradient -->
  <div class="nav-gradient"></div>

  <!-- Logo -->
  <a href="#" class="logo">
    VELO<span class="highlight">DRIVE</span>
  </a>

  <!-- Desktop Links -->
  <ul class="nav-links">
    @for (item of menuItems; track item){
      <li>
        <a href="#">{{ item }}</a>
      </li>
    }
  </ul>

  <!-- Desktop Actions -->
  <div class="nav-actions">
    <a href="#" class="btn-login">Zaloguj się</a>
    <a href="#" class="btn-reserve">Rezerwuj</a>
  </div>

  <!-- Hamburger Button (Mobile) -->
  <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Menu">
    {{ menuOpen ? '✕' : '☰' }}
  </button>
</nav>

@if (menuOpen) {
  <div class="mobile-menu">
    @for (item of menuItems; track item){
      <a href="#">{{ item }}</a>
    }

    <a href="#" class="mobile-login">Zaloguj się</a>
    <a href="#" class="mobile-reserve">Rezerwuj</a>
  </div>
}
