<section class="fleet-section">
  <div class="container">
    <!-- Header sekcji -->
    <div class="fleet-header">
      <div>
        <p class="section-badge">Nasza flota</p>
        <h2 class="section-title">
          POJAZDY NA KAŻDĄ
          <br />
          <span class="title-muted">OKAZJĘ</span>
        </h2>
      </div>
      <a routerLink="/cars" class="see-all-link">
        Zobacz całą flotę <span class="arrow">→</span>
      </a>
    </div>

    <!-- Car cards grid -->
    <div class="fleet-grid">
      @for (car of fleet; track car.name) {
        <div class="car-card">
          <!-- Image and overlay -->
          <div class="card-media">
            <img [src]="car.img" [alt]="car.name" class="car-img" />
            <div class="media-overlay"></div>
            <span class="badge badge-primary">{{ car.badge }}</span>
            <span class="badge-category">{{ car.category }}</span>
          </div>

          <!-- Card content -->
          <div class="card-body">
            <h3 class="car-title">{{ car.name }}</h3>

            <div class="car-specs">
              <span class="spec-item">👥 {{ car.seats }} os.</span>
              <span class="spec-item">⛽ {{ car.fuel }}</span>
              <span class="spec-item">⚡ {{ car.range }}</span>
            </div>

            <div class="card-footer">
              <div class="price-block">
                <span class="price-prefix">od</span>
                <div class="price-value">
                  <span class="amount">{{ car.price }}</span>
                  <span class="currency">zł / dzień</span>
                </div>
              </div>

              <button class="btn-book">Rezerwuj</button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
