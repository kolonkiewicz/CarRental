<div class="header-section">
  <div class="badge-category-wrapper">
    @if (badge) {
      <span class="badge-tag" [ngClass]="getBadgeClass(badge)">
        {{ badge }}
      </span>
    }
    <span class="category-tag">{{ category }}</span>
  </div>

  <h1 class="car-title">
    {{ brand + ' ' + model | uppercase }}
  </h1>

  <div class="rating-availability-wrapper">
    <div class="rating-stars">
      @for (star of starsArray; track $index) {
        <fa-icon
          [icon]="faStar"
          class="star-icon"
          [ngClass]="
            $index < mathFloor(rating)
                ? 'star-active'
                : 'star-inactive'
          "
        ></fa-icon>
      }
      <span class="rating-score">{{ rating }}</span>
      <span class="reviews-count">({{ reviewsCount }} opinii)</span>
    </div>

    <span
      class="availability-status"
      [ngClass]="isAvailable ? 'status-available' : 'status-unavailable'"
    >
      {{ isAvailable ? '● Dostępny' : '● Niedostępny' }}
    </span>
  </div>
</div>
