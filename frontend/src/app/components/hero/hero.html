<section class="hero-section">
  <!-- Tło i gradienty -->
  <div class="hero-bg">
    <img [src]="heroImg" alt="Luksusowy samochód na drodze" class="hero-img" />
    <div class="gradient-overlay-left"></div>
    <div class="gradient-overlay-bottom"></div>
  </div>

  <!-- Treść -->
  <div class="hero-content">
    <div class="hero-text-block">
      <p class="hero-subtitle">Wypożyczalnia Premium · Polska</p>
      
      <h1 class="hero-title">
        JEDŹ<br />
        <span class="highlight">KLASY</span><br />
        WYŻSZEJ.
      </h1>

      <p class="hero-description">
        Ponad 300 pojazdów premium dostępnych w 6 miastach Polski. Odbiór w 15 minut, dostawa pod drzwi.
      </p>
    </div>
    <app-booking-form></app-booking-form>
  </div>
</section>
