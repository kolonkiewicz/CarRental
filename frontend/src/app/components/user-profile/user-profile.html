@if (activeTab === 'profile') {
<div class="profile-tab-container">

    <!-- DANE OSOBOWE -->
    <div class="section-card">

        <h2 class="section-title">
            Dane osobowe
        </h2>

        <div class="form-grid">

            <div class="form-group">
                <label class="input-label">Imię</label>
                <input type="text" class="custom-input" [(ngModel)]="profile.firstName" readonly>
            </div>

            <div class="form-group">
                <label class="input-label">Nazwisko</label>
                <input type="text" class="custom-input" [(ngModel)]="profile.lastName" readonly>
            </div>

            <div class="form-group">
                <label class="input-label">Telefon</label>
                <input type="tel" class="custom-input" [(ngModel)]="profile.phone" readonly>
            </div>

            

            <div class="form-group">
                <label class="input-label">Adres e-mail</label>
                <input type="email" class="custom-input" [(ngModel)]="profile.email" readonly>
            </div>

        </div>

    </div>

    <div class="section-card">

        <h2 class="section-title">
            Zmiana hasła
        </h2>

        <div class="form-grid">

            <div class="form-group">
                <label class="input-label">
                    Nowe hasło
                </label>

                <input type="password" placeholder="Minimum 8 znaków" class="custom-input" >
            </div>


            <div class="form-group">
                <label class="input-label">
                    Potwierdź hasło
                </label>

                <input type="password" placeholder="Powtórz nowe hasło" class="custom-input">
            </div>


            
            <p class="error-text col-span-full">
                
            </p>
            
        </div>

    </div>

    <div class="actions-row">

        <button type="button" (click)="saveProfile()" class="btn-save">

            Zapisz zmiany

            
            <fa-icon [icon]="faCheck"></fa-icon>
            

        </button>

        
        <span class="success-message">
            
        </span>
        

    </div>

</div>
}
